<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园快递代取平台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">CX</span>
        <span class="brand-text">
          <strong>校园快递代取</strong>
          <small>Campus Express</small>
        </span>
      </a>
      <div id="user-area" class="user-area hidden"></div>
    </header>

    <main id="login-view" class="login-layout">
      <section class="login-hero">
        <p class="eyebrow">校园内的顺路互助</p>
        <h1>把取快递这件事，<br>交给顺路的人。</h1>
        <p class="hero-copy">学生发布代取需求，骑手接单后取件、送达，下单人确认签收。订单状态、钱包流水和操作记录都留在系统里，出了问题能查到具体环节。</p>
        <div class="hero-points">
          <article>
            <strong>发布</strong>
            <span>填写取件点、送达点和跑腿费</span>
          </article>
          <article>
            <strong>接单</strong>
            <span>骑手接单后按状态推进配送</span>
          </article>
          <article>
            <strong>签收</strong>
            <span>确认后自动结算，生成流水</span>
          </article>
        </div>
        <div class="hero-note">课程项目 · 前后端与数据库完整实现</div>
      </section>

      <section class="auth-panel">
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active" type="button">登录</button>
          <button id="tab-register" class="auth-tab" type="button">注册</button>
        </div>

        <form id="login-form" class="auth-form">
          <label>手机号
            <input id="login-phone" name="phone" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="username" required>
          </label>
          <label>密码
            <input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
          </label>
          <button class="primary-btn" type="submit">进入工作台</button>
          <p id="login-error" class="form-error"></p>
        </form>

        <form id="register-form" class="auth-form hidden">
          <label>手机号
            <input id="register-phone" name="phone" inputmode="numeric" maxlength="11" placeholder="用于登录，注册后不可修改" required>
          </label>
          <label>密码
            <input id="register-password" name="password" type="password" placeholder="至少 6 位" minlength="6" required>
          </label>
          <button class="primary-btn" type="submit">创建学生账号</button>
          <p id="register-error" class="form-error"></p>
        </form>

        <div class="demo-block">
          <div class="demo-title"><span>演示账号</span><span class="line"></span></div>
          <div class="demo-grid">
            <button type="button" class="demo-btn" data-phone="13800000001" data-password="Stu@123">
              <strong>学生</strong><span>13800000001</span>
            </button>
            <button type="button" class="demo-btn" data-phone="13800000002" data-password="Run@123">
              <strong>骑手</strong><span>13800000002</span>
            </button>
            <button type="button" class="demo-btn" data-phone="13800000000" data-password="Admin@123">
              <strong>管理员</strong><span>13800000000</span>
            </button>
          </div>
          <p class="demo-tip">学生账号预置 300 元余额；骑手账号预置 50 元余额。</p>
        </div>
      </section>
    </main>

    <main id="app-view" class="app-layout hidden">
      <aside class="sidebar">
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>
          <span>服务运行中</span>
        </div>
      </aside>
      <section class="workspace">
        <div class="workspace-head">
          <div>
            <p id="page-kicker" class="page-kicker">工作台</p>
            <h2 id="page-title">我的订单</h2>
          </div>
          <div id="page-actions" class="page-actions"></div>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="订单详情">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="关闭">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
